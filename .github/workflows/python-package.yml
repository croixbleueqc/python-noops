# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Python package
on:
  push:
    branches:
      - main
      - master
      - feature/**
  pull_request:
    branches:
      - feature/**
  workflow_dispatch:

jobs:
  build_and_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [
          "3.9", "3.10","3.11", "3.12", "3.13"
        ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests with pylint
        run: |
          pylint --fail-under=9.5 noops/ tests/

      - name: Unit Tests
        run: |
          git config --global user.email "unittests@noops.local"
          git config --global user.name "Unit Tests"
          git config --global init.defaultBranch "main"
          coverage run -m unittest

      - name: Unit Tests Coverage Report
        if: success() || failure()
        run: |
          coverage report -m --fail-under=85

  releaseGitTags:
    runs-on: ubuntu-latest
    needs: build_and_tests
    condition: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v3.1.1
        id: gitversion

      - name: Get VersionTag
        id: v
        run: echo "version=${{ steps.gitversion.outputs.majorMinorPatch }}${{ steps.gitversion.outputs.PreReleaseLabelWithDash }}" >> $GITHUB_OUTPUT

      - name: Create/Update tag
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git tag ${{ steps.v.outputs.version }} ${{ steps.gitversion.outpus.VersionSourceSha }} -f
          git push --tags -f